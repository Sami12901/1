[package]
name = "capbd-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application runner for CapBD (Windows, Linux, macOS)"

[[bin]]
name = "capbd"
path = "src/main.rs"

[dependencies]
capbd-core = { path = "../capbd-core" }
capbd-engine = { path = "../capbd-engine" }
capbd-ui = { path = "../capbd-ui" }
eframe = { version = "0.29", default-features = true, features = ["wgpu"] }
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
